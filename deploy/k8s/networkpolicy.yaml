# Customize egress CIDRs/namespaces for your environment before production use.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resume-api-default-deny-ingress
spec:
  podSelector:
    matchLabels:
      app: resume-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
