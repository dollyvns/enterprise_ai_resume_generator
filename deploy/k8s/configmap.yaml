apiVersion: v1
kind: ConfigMap
metadata:
  name: resume-api-config
data:
  APP_ENV: "prod"
  APP_NAME: "enterprise-ai-resume-generator"
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "INFO"
  ALLOWED_ORIGINS: "https://resume.example.com"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  OPENAI_MODEL: "replace-with-approved-model"
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "2"
  MAX_REVIEW_REVISIONS: "1"
  REVIEW_PASS_SCORE: "85"
  METRICS_ENABLED: "true"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "enterprise-ai-resume-generator"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
